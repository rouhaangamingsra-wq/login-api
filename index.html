<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rouhaan · Login</title>
  <style>
    :root {
      --bg-1: #6366f1;
      --bg-2: #8b5cf6;
      --bg-3: #ec4899;
      --card: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.5);
      --text: #1e293b;
      --text-muted: #64748b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --error: #ef4444;
      --input-bg: #f8fafc;
      --input-border: #e2e8f0;
      --input-focus: #6366f1;
      --radius: 14px;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
      background-size: 200% 200%;
      animation: gradientShift 12s ease infinite;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 40px 36px;
      animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-3));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 24px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      background: var(--input-bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      position: relative;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
      border-radius: 9px;
      transition: color 0.25s ease;
      z-index: 1;
    }

    .tab.active { color: var(--primary); }

    .tab-indicator {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      background: #fff;
      border-radius: 9px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tabs[data-active="login"] .tab-indicator { transform: translateX(100%); }

    .form-panel { display: none; animation: fadeIn 0.3s ease; }
    .form-panel.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      margin-left: 2px;
    }

    .input-wrap { position: relative; }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 13px 14px 13px 42px;
      font-size: 15px;
      color: var(--text);
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input::placeholder { color: #94a3b8; }

    input:focus {
      border-color: var(--input-focus);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-pass svg { width: 18px; height: 18px; }

    .btn {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      margin-top: 6px;
    }

    .btn:hover:not(:disabled) { background: var(--primary-hover); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }

    .btn .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    .btn.loading .label { display: none; }
    .btn.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .message {
      margin-top: 14px;
      padding: 10px 14px;
      font-size: 13.5px;
      font-weight: 500;
      border-radius: 10px;
      text-align: center;
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .message.show { display: block; }
    .message.success { background: rgba(16, 185, 129, 0.12); color: var(--success); }
    .message.error { background: rgba(239, 68, 68, 0.12); color: var(--error); }

    .switch-hint {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 18px;
    }

    .switch-hint a {
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .switch-hint a:hover { text-decoration: underline; }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 22px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo">R</div>
      <h1>Welcome back</h1>
      <p>Sign in or create your account</p>
    </div>

    <div class="tabs" data-active="login" id="tabs">
      <div class="tab-indicator"></div>
      <button class="tab active" data-tab="login">Login</button>
      <button class="tab" data-tab="signup">Sign up</button>
    </div>

    <!-- Login -->
    <div class="form-panel active" id="panel-login">
      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="lEmail">Email</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
            <input type="email" id="lEmail" placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>
        <div class="field">
          <label for="lPass">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="lPass" placeholder="Enter password" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" data-target="lPass" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn" id="loginBtn"><span class="label">Sign in</span><span class="spinner"></span></button>
        <div class="message" id="loginMsg"></div>
      </form>
      <p class="switch-hint">Don't have an account? <a data-switch="signup">Create one</a></p>
    </div>

    <!-- Signup -->
    <div class="form-panel" id="panel-signup">
      <form id="signupForm" autocomplete="on">
        <div class="field">
          <label for="sEmail">Email</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
            <input type="email" id="sEmail" placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>
        <div class="field">
          <label for="sPass">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="sPass" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>
            <button type="button" class="toggle-pass" data-target="sPass" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn" id="signupBtn"><span class="label">Create account</span><span class="spinner"></span></button>
        <div class="message" id="signupMsg"></div>
      </form>
      <p class="switch-hint">Already have an account? <a data-switch="login">Sign in</a></p>
    </div>

    <p class="footer-note">Secured with bcrypt · MongoDB</p>
  </div>

  <script>
    var tabs = document.getElementById('tabs');
    var tabButtons = tabs.querySelectorAll('.tab');
    var panels = document.querySelectorAll('.form-panel');

    function switchTab(name) {
      tabs.dataset.active = name;
      tabButtons.forEach(function(t) { t.classList.toggle('active', t.dataset.tab === name); });
      panels.forEach(function(p) { p.classList.toggle('active', p.id === 'panel-' + name); });
      hideMsg('loginMsg'); hideMsg('signupMsg');
    }

    tabButtons.forEach(function(t) { t.addEventListener('click', function() { switchTab(t.dataset.tab); }); });
    document.querySelectorAll('[data-switch]').forEach(function(a) {
      a.addEventListener('click', function() { switchTab(a.dataset.switch); });
    });

    document.querySelectorAll('.toggle-pass').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var input = document.getElementById(btn.dataset.target);
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    function showMsg(id, text, ok) {
      var el = document.getElementById(id);
      el.textContent = text;
      el.className = 'message show ' + (ok ? 'success' : 'error');
    }
    function hideMsg(id) { document.getElementById(id).className = 'message'; }

    function setLoading(btnId, loading) {
      document.getElementById(btnId).classList.toggle('loading', loading);
      document.getElementById(btnId).disabled = loading;
    }

    function request(url, body, btnId, msgId, okMsg) {
      setLoading(btnId, true);
      hideMsg(msgId);
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      })
      .then(function(r) { return r.json().then(function(d) { return { status: r.status, data: d }; }); })
      .then(function(res) {
        var ok = res.status >= 200 && res.status < 300;
        showMsg(msgId, ok ? okMsg : (res.data.message || 'Something went wrong'), ok);
      })
      .catch(function() { showMsg(msgId, 'Network error — please try again', false); })
      .finally(function() { setLoading(btnId, false); });
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      request('/login',
        { email: lEmail.value.trim(), password: lPass.value },
        'loginBtn', 'loginMsg', 'Login successful! Redirecting…');
    });

    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      request('/signup',
        { email: sEmail.value.trim(), password: sPass.value },
        'signupBtn', 'signupMsg', 'Account created! You can now sign in.');
    });
  </script>
</body>
</html>
